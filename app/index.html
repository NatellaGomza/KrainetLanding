<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cat Energy</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="header">
    <div class="header__logo">
        <img src="assets/logo-mobile.png" alt=""/>
        <img src="assets/logo 2.png" alt=""/>
    </div>
    <nav class="header__nav">
        <button class="nav__burger" aria-label="Открыть меню">
            <span class="burger-icon"></span>
        </button>
        <ul class="nav__list">
            <li class="nav__item"><a href="#main-banner" class="nav__link">Главная</a></li>
            <li class="nav__item"><a href="#catalog" class="nav__link">Каталог продукции</a></li>
            <li class="nav__item"><a href="#program" class="nav__link">Подбор программы</a></li>
        </ul>
    </nav>
</header>

<main class="main">
    <section id="main-banner" class="main-banner grid-container">
        <h1 class="main-banner__title g1">Функциональное питание для котов</h1>
        <p class="main-banner__subTitle g2">Занялся собой? Займись котом!</p>
        <img class='main-banner__image g3' src="assets/index-can.png" alt=""/>
        <div class='main-banner__button g4'>Подобрать программу</div>
        <div class='g5'></div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
